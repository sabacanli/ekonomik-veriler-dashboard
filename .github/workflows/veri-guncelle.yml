# Otomatik veri güncelleme — hafta içi her gün, günde iki kez.
# EVDS/HMB/web kaynaklı modüllerin verisini çeker, site paketlerini üretir, commit'ler ve siteyi yeniden yayınlar.
# (BDDK hariç: o veri yalnızca yerel bilgisayardan Selenium ile çekilebilir.)
#
# Zamanlama (24.11.2026'da haftalıktan günlüğe çevrildi): önceden yalnız Perşembe + Cuma çalışıyordu; TCMB rezervleri,
# para politikası göstergeleri ve doğrudan alım gibi GÜNLÜK seriler hafta başında 3–4 iş günü geride kalıyordu
# (kullanıcı 24.11 Salı günü rezervin 19.11'de kaldığını fark etti). GitHub bu depoda zamanlanmış koşuları saatlerce
# geciktiriyor (gözlenen: 7–8 saat). Bu yüzden iki tetik var: 08:17 TR (gecikmeyle öğleden sonra, TCMB 14:30 yayınlarının
# ardından çalışır) ve 14:45 TR (gecikmeyle gece; günün tüm yayınlarını toplar). GitHub gecikmezse de 14:45 koşusu
# Perşembe 14:30 haftalık istatistiklerini yakalar.
#
# Düzenleme Zaman Çizelgesi (28.11.2026): aynı koşuda TCMB, BDDK ve SPK'nın yeni duyuruları taranır, Claude ile özetlenir
# (duzenleme/guncelle.py). Kurumlar hafta sonu da duyuru yayımladığı için (TCMB makroihtiyati duyuruları çoğu kez
# Cumartesi çıkar) Cumartesi–Pazar için bir tetik daha vardır; o koşuda diğer modüller de çalışır, yeni veri yoksa
# commit üretmez.
#
# Gerekli secret: EVDS_API_KEY  (Settings → Secrets and variables → Actions)
# İsteğe bağlı secret: ANTHROPIC_API_KEY (bülteninkiyle aynı) — yoksa yeni duyurular işlenmeden bekler.
# Variable: DUZENLEME_MODEL (varsayılan claude-opus-5-5)
# Elle çalıştırma: Actions sekmesi → bu workflow → "Run workflow".
name: Veri Güncelleme (hafta içi her gün)

on:
  schedule:
    - cron: "17 5 * * 1-5"    # Pzt–Cum 05:17 UTC = 08:17 TR
    - cron: "45 11 * * 1-5"   # Pzt–Cum 11:45 UTC = 14:45 TR
    - cron: "30 9 * * 0,6"    # Cmt–Paz 09:30 UTC = 12:30 TR (hafta sonu duyuruları için)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
      TCMB_API_KEY: ${{ secrets.EVDS_API_KEY }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: pip install --quiet pandas requests openpyxl xlrd beautifulsoup4 matplotlib numpy pymupdf anthropic

      - name: Verileri çek (başarısız modül atlanır, kalanlar devam eder)
        run: |
          FAILS=""
          calistir() {
            echo "──────── $1 ────────"
            if timeout 600 python "$2"; then
              echo "✓ $1 güncellendi"
            else
              echo "::warning::$1 güncellenemedi (atlandı)"
              FAILS="$FAILS | $1"
            fi
          }
          calistir "TCMB Haftalık Stok"      "tcmb haftalık stok/tcmb_data.py"
          calistir "Net Rezerv"              "net rezerv/net_rezerv_fetch.py"
          calistir "Rezerv Likidite (URDL)"  "net rezerv/likidite_fetch.py"
          calistir "Enflasyon"               "enflasyon/enflasyon_fetch.py"
          calistir "Kredi/Mevduat"           "kredi mevduat/kredi_mevduat_fetch.py"
          calistir "Yabancı Para (DTH)"      "yabanci para hareketi/dth_fetch.py"
          calistir "Cari Denge"              "cari acik/evds_fetch.py"
          calistir "Ödemeler Dengesi"        "cari acik/odemeler_dengesi_fetch.py"
          calistir "Cari Bileşenleri"        "cari acik/cari_bilesen_fetch.py"
          calistir "Bütçe"                   "butce/butce_fetch.py"
          calistir "Hazine Nakit"            "hazine nakit/nakit_fetch.py"
          calistir "Hazine İhale — çek"      "hazine ihale /hazine_ihale_cek.py"
          calistir "Hazine İhale — analiz"   "hazine ihale /hazine_analiz.py"
          calistir "Hazine İhale — ödeme"    "hazine ihale /hazine_odeme.py"
          calistir "TCMB Doğrudan Alım"      "tcmb dogrudan alım/guncelle.py"
          calistir "Analitik Bilanço Aktif"  "tcmb dogrudan alım/analitik_fetch.py"
          calistir "Para Politikası"         "tcmb faiz/tcmb_faiz_fetch.py"
          echo ""
          echo "Başarısız modüller:${FAILS:- (yok — hepsi güncellendi)}"

      # Bu adım düşse de diğer veriler yayımlanır (continue-on-error). Sisteme ait sorun duzenleme/durum.json'a,
      # elle bakılması gereken belge duzenleme/bekleyen.json'a yazılır; ikisini de sabah kontrolcüsü okur.
      - name: Düzenleme çizelgesini güncelle (TCMB, BDDK, SPK duyuruları)
        id: duzenleme
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DUZENLEME_MODEL: ${{ vars.DUZENLEME_MODEL || 'claude-opus-5-5' }}
        run: timeout 900 python duzenleme/guncelle.py

      - name: Site veri paketlerini üret
        run: python site_export.py

      - name: Değişiklikleri commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tcmb haftalık stok/output" "net rezerv" "enflasyon" "kredi mevduat" \
                  "yabanci para hareketi" "cari acik" "butce" "hazine nakit" \
                  "hazine ihale " "tcmb dogrudan alım" "tcmb faiz" duzenleme site
          if git diff --cached --quiet; then
            echo "Yeni veri yok — commit atlanıyor."
          else
            git commit -m "Otomatik veri güncelleme ($(date -u '+%d.%m.%Y %H:%M') UTC)"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Pages'i yapılandır
        continue-on-error: true   # GitHub "Server Error" verirse yayın yine denenir (Pages zaten etkin)
        uses: actions/configure-pages@v6

      - name: Site klasörünü paketle
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHub yeni yüklenen paketi bazen bir-iki saniye listelemiyor ("No artifacts named github-pages were found";
      # 11.11 ve 13.11.2026) → kısa bekleme; yayın yine de düşerse bir kez daha denenir
      - name: Paketin listelenmesini bekle
        run: sleep 8

      - name: Yayınla
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: İkinci deneme öncesi bekle
        if: steps.deployment.outcome == 'failure'
        run: sleep 40

      - name: Yayınla (ikinci deneme)
        if: steps.deployment.outcome == 'failure'
        id: deployment2
        uses: actions/deploy-pages@v5
