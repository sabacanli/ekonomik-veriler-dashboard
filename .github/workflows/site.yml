# Statik siteyi (site/) GitHub Pages'e yayınlar.
# Tetikleme: site/ altında değişiklik içeren her push (ör. "Buluta Yayınla"
# ve "Güncelle (yerel + bulut)" butonları) veya elle (Actions sekmesi).
name: Site Yayınla

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Pages'i yapılandır (ilk çalışmada otomatik etkinleştirir)
        continue-on-error: true   # GitHub "Server Error" verirse (12.11.2026) yayın yine denenir; Pages zaten etkin
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Site klasörünü paketle
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHub yeni yüklenen paketi bazen bir-iki saniye listelemiyor ("No artifacts named github-pages were found";
      # 11.11 ve 13.11.2026'da yayın bu yüzden düştü) → kısa bekleme; yine de düşerse bir kez daha denenir.
      - name: Paketin listelenmesini bekle
        run: sleep 8

      - name: Yayınla
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: İkinci deneme öncesi bekle
        if: steps.deployment.outcome == 'failure'
        run: sleep 40

      - name: Yayınla (ikinci deneme)
        if: steps.deployment.outcome == 'failure'
        id: deployment2
        uses: actions/deploy-pages@v5
