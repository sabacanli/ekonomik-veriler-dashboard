# Finans Gündemi — günlük haber toplama + e-posta bülteni.
# Her sabah son 24 saatin (Pazartesi: hafta sonu dahil 72 saatin) finans haberlerini RSS akışlarından
# toplar, seçer, kategorilere ayırır, site/data/haber/ altına günlük arşivi yazar, siteyi yeniden
# yayınlar ve hafta içi günlerde bülteni e-postayla gönderir.
#
# Secret'lar (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY  — isteğe bağlı; varsa seçki ve özetler Claude ile, yoksa anahtar kelime filtresi
#   RESEND_API_KEY     — e-posta gönderimi (Resend); yoksa bülten adımı sessizce atlanır
#   BULTEN_ALICILAR    — alıcı adresleri, virgülle ayrılmış (DEPO HERKESE AÇIK: adresler yalnız burada durur)
#   BULTEN_YANIT       — isteğe bağlı yanıt adresi
# Variable'lar: HABER_MODEL (varsayılan claude-opus-5), BULTEN_GONDEREN (varsayılan bulten@ekordion.com.tr)
#
# Not: GitHub zamanlayıcısı bu depoda saatlerce gecikebiliyor; kesin saat için harici tetik
#   (workflow_dispatch API çağrısı, bulten=evet) kullanılmalı. Aynı gün iki koşu olursa Resend'in
#   Idempotency-Key'i sayesinde kimseye ikinci e-posta gitmez.
# Elle çalıştırma: Actions sekmesi → bu workflow → "Run workflow" (bülten: hayir / test / evet).
name: Finans Gündemi (günlük)

on:
  schedule:
    - cron: "30 4 * * *"   # her gün 04:30 UTC = 07:30 TR
  workflow_dispatch:
    inputs:
      saat:
        description: "Geriye dönük pencere (saat) — boş: otomatik (Pazartesi 72, diğer günler 24)"
        default: ""
      bulten:
        description: "E-posta bülteni: hayir = gönderme · test = yalnız ilk alıcıya · evet = tüm listeye"
        type: choice
        options: ["hayir", "test", "evet"]
        default: "hayir"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gundem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: pip install --quiet requests anthropic

      - name: Haberleri topla
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HABER_MODEL: ${{ vars.HABER_MODEL || 'claude-opus-5' }}
        run: |
          SAAT="${{ github.event.inputs.saat }}"
          if [ -z "$SAAT" ]; then
            # Pazartesi bülteni hafta sonunu da kapsar
            if [ "$(TZ=Europe/Istanbul date +%u)" = "1" ]; then SAAT=72; else SAAT=24; fi
          fi
          python haberler/haber_topla.py --saat "$SAAT"

      - name: Değişiklikleri commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "Yeni haber yok — commit atlanıyor."
          else
            git commit -m "Finans gündemi ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Pages'i yapılandır
        uses: actions/configure-pages@v5

      - name: Site klasörünü paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4

      - name: E-posta bültenini gönder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BULTEN_ALICILAR: ${{ secrets.BULTEN_ALICILAR }}
          BULTEN_YANIT: ${{ secrets.BULTEN_YANIT }}
          BULTEN_GONDEREN: ${{ vars.BULTEN_GONDEREN }}
        run: |
          MOD="${{ github.event.inputs.bulten }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # zamanlanmış koşu: hafta içi (Pzt–Cum, TR saatiyle) tüm listeye gönder
            if [ "$(TZ=Europe/Istanbul date +%u)" -le 5 ]; then MOD=evet; else MOD=hayir; fi
          fi
          if [ "$MOD" = "evet" ] || [ "$MOD" = "test" ]; then
            python haberler/bulten_gonder.py --mod "$MOD"
          else
            echo "Bülten gönderilmiyor (mod: ${MOD:-hayir})."
          fi
