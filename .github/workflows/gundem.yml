# Finans Gündemi — günlük haber toplama + e-posta bülteni.
# Her sabah son 24 saatin (Pazartesi: hafta sonu dahil 72 saatin) finans haberlerini RSS akışlarından
# toplar, seçer, kategorilere ayırır, site/data/haber/ altına günlük arşivi yazar, siteyi yeniden
# yayınlar ve hafta içi günlerde bülteni e-postayla gönderir.
#
# Secret'lar (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY  — isteğe bağlı; varsa seçki ve özetler Claude ile, yoksa anahtar kelime filtresi
#   RESEND_API_KEY     — e-posta gönderimi (Resend); yoksa bülten adımı sessizce atlanır
#   BULTEN_ALICILAR    — alıcı adresleri, virgülle ayrılmış (DEPO HERKESE AÇIK: adresler yalnız burada durur)
#   BULTEN_YANIT       — isteğe bağlı yanıt adresi
# Variable'lar: HABER_MODEL (varsayılan claude-opus-5), BULTEN_GONDEREN (varsayılan bulten@ekordion.com.tr)
#
# Tetikleme: GitHub zamanlayıcısı bu depoda saatlerce gecikebildiğinden asıl tetik Cloudflare Worker'dır
#   (cloudflare/gundem-tetik.js → workflow_dispatch: her gün 07:50 TR günlük; Pazar 19:00 TR haftalık).
#   Aşağıdaki schedule'lar yalnız YEDEKTİR: o günün/haftanın Claude'lu çıktısı zaten üretilmişse hiçbir şey
#   yapmadan çıkar. Yine de iki koşu olursa Resend'in Idempotency-Key'i sayesinde kimseye ikinci e-posta gitmez.
# İki tür: gunluk (Finans Gündemi, hafta içi e-posta) · haftalik (Pazar "Haftaya Bakış": geçen hafta + gelecek hafta).
# Elle çalıştırma: Actions sekmesi → bu workflow → "Run workflow" (tür + bülten: hayir / test / evet).
name: Finans Gündemi (günlük)

on:
  schedule:
    - cron: "30 6 * * *"   # YEDEK günlük: 06:30 UTC = 09:30 TR (asıl tetik: Cloudflare, 07:50 TR)
    - cron: "30 17 * * 0"  # YEDEK haftalık: Pazar 17:30 UTC = 20:30 TR (asıl tetik: Cloudflare, 19:00 TR)
  workflow_dispatch:
    inputs:
      tur:
        description: "Bülten türü: gunluk = Finans Gündemi · haftalik = Pazar Haftaya Bakış"
        type: choice
        options: ["gunluk", "haftalik"]
        default: "gunluk"
      saat:
        description: "Geriye dönük pencere (saat) — boş: otomatik (Pazartesi 72, diğer günler 24)"
        default: ""
      bulten:
        description: "E-posta bülteni: hayir = gönderme · test = yalnız ilk alıcıya · evet = tüm listeye"
        type: choice
        options: ["hayir", "test", "evet"]
        default: "hayir"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gundem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Tür ve yedek koşu kontrolü
        id: kontrol
        run: |
          TUR="${{ github.event.inputs.tur }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Pazar 17:00 TR sonrası zamanlanmış koşu haftalık yedektir; diğerleri günlük yedek
            if [ "$(TZ=Europe/Istanbul date +%u)" = "7" ] && [ "$(TZ=Europe/Istanbul date +%H)" -ge 17 ]; then TUR=haftalik; else TUR=gunluk; fi
          fi
          TUR="${TUR:-gunluk}"
          echo "tur=$TUR" >> "$GITHUB_OUTPUT"
          if [ "$TUR" = "haftalik" ]; then
            DOSYA="site/data/haber/hafta-$(TZ=Europe/Istanbul date +%G-W%V).json"
          else
            DOSYA="site/data/haber/$(TZ=Europe/Istanbul date +%Y-%m-%d).json"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "$DOSYA" ] && grep -q '"mod":"ai"' "$DOSYA"; then
            echo "Bu $TUR çıktı zaten Claude ile üretilmiş (harici tetik çalışmış) — yedek koşu atlanıyor."
            echo "atla=true" >> "$GITHUB_OUTPUT"
          else
            echo "atla=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Tür: $TUR · dosya: $DOSYA"

      - name: Python kur
        if: steps.kontrol.outputs.atla != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        if: steps.kontrol.outputs.atla != 'true'
        run: pip install --quiet requests anthropic yfinance

      - name: Bülten modunu belirle
        if: steps.kontrol.outputs.atla != 'true'
        id: mod
        run: |
          MOD="${{ github.event.inputs.bulten }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # zamanlanmış koşu: günlük bülten hafta içi (Pzt–Cum, TR saatiyle), haftalık bülten Pazar tüm listeye
            if [ "${{ steps.kontrol.outputs.tur }}" = "haftalik" ]; then MOD=evet
            elif [ "$(TZ=Europe/Istanbul date +%u)" -le 5 ]; then MOD=evet; else MOD=hayir; fi
          fi
          echo "mod=${MOD:-hayir}" >> "$GITHUB_OUTPUT"
          echo "Bülten modu: ${MOD:-hayir}"

      - name: Ekonomik takvim ve günün rakamları
        if: steps.kontrol.outputs.atla != 'true'
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          python takvim/takvim_uret.py || echo "::warning::takvim üretilemedi — mevcut takvim.json kullanılacak"
          python piyasa/piyasa_fetch.py || echo "::warning::piyasa verisi alınamadı — rakam tablosu eksik kalabilir"

      - name: Haberleri topla
        if: steps.kontrol.outputs.atla != 'true' && steps.kontrol.outputs.tur == 'gunluk'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HABER_MODEL: ${{ vars.HABER_MODEL || 'claude-opus-5' }}
        run: |
          SAAT="${{ github.event.inputs.saat }}"
          if [ -z "$SAAT" ]; then
            # Pazartesi bülteni hafta sonunu da kapsar
            if [ "$(TZ=Europe/Istanbul date +%u)" = "1" ]; then SAAT=72; else SAAT=24; fi
          fi
          # Bülten tüm listeye gidiyorsa 'yeni açıklanan veriler' durumu bu koşuda ilerletilir
          if [ "${{ steps.mod.outputs.mod }}" = "evet" ]; then BULTEN=--bulten; else BULTEN=""; fi
          python haberler/haber_topla.py --saat "$SAAT" $BULTEN

      - name: Haftaya Bakış (Pazar)
        if: steps.kontrol.outputs.atla != 'true' && steps.kontrol.outputs.tur == 'haftalik'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HABER_MODEL: ${{ vars.HABER_MODEL || 'claude-opus-5' }}
        run: |
          if [ "${{ steps.mod.outputs.mod }}" = "evet" ]; then BULTEN=--bulten; else BULTEN=""; fi
          python haberler/hafta_ozeti.py $BULTEN

      - name: Değişiklikleri commit + push
        if: steps.kontrol.outputs.atla != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site takvim
          if git diff --cached --quiet; then
            echo "Yeni haber yok — commit atlanıyor."
          else
            git commit -m "$([ "${{ steps.kontrol.outputs.tur }}" = "haftalik" ] && echo "Haftaya Bakış" || echo "Finans gündemi") ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Pages'i yapılandır
        if: steps.kontrol.outputs.atla != 'true'
        uses: actions/configure-pages@v5

      - name: Site klasörünü paketle
        if: steps.kontrol.outputs.atla != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Yayınla
        if: steps.kontrol.outputs.atla != 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: E-posta bültenini gönder
        if: steps.kontrol.outputs.atla != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BULTEN_ALICILAR: ${{ secrets.BULTEN_ALICILAR }}
          BULTEN_YANIT: ${{ secrets.BULTEN_YANIT }}
          BULTEN_GONDEREN: ${{ vars.BULTEN_GONDEREN }}
        run: |
          MOD="${{ steps.mod.outputs.mod }}"
          if [ "$MOD" = "evet" ] || [ "$MOD" = "test" ]; then
            python haberler/bulten_gonder.py --mod "$MOD" --tur "${{ steps.kontrol.outputs.tur }}"
          else
            echo "Bülten gönderilmiyor (mod: ${MOD:-hayir})."
          fi
